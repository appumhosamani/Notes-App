{% extends "base.html" %}

{% block breadcrumb %} Signup Page {% endblock %}

{% block content %}
<div class="form-box">
  <div class="form-header">Signup</div>
  <div class="form-body">
    <h2 style="text-align:center; margin-bottom: 15px;">Sign up</h2>
    <div id="signup-message"></div>

    <label>Username</label>
    <input type="text" id="signup-name" placeholder="Username" required>

    <label>Email</label>
    <input type="email" id="signup-email" placeholder="Email" required>

    <label>Password</label>
    <input type="password" id="signup-password" placeholder="Password" required>

    <label>Confirm Password</label>
    <input type="password" id="signup-confirm-password" placeholder="Confirm Password" required>

    <div class="form-actions">
      <button id="signup-btn" class="btn register-btn">Register</button>
      <a href="{{ url_for('login') }}" class="btn login-btn">Login</a>
    </div>
  </div>
</div>
{% endblock %}
